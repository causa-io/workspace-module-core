# yaml-language-server: $schema=.causa/configuration-schema.yaml

workspace:
  name: causa

project:
  name: workspace-module-core
  description: The Causa workspace module providing core function definitions and some implementations.
  language: typescript
  type: package

causa:
  modules:
    '@causa/workspace-core': ^1.0.0
    '@causa/workspace-typescript': ^1.0.0

javascript:
  dependencies:
    check:
      allowlist:
        - GHSA-2gqq-gqf2-x968
        - GHSA-2jfj-6hjv-fm6j
        - GHSA-3wwx-pv8p-q78v
        - GHSA-3xpg-4rpp-hhhm
        - GHSA-8436-99hf-9mmv
        - GHSA-pmjh-fq2x-6v4x
        - GHSA-r53p-7pc4-xj5r
        - GHSA-rfgv-xxqx-mfg5
        - GHSA-rx4f-c7p8-82vq
        - GHSA-w293-vg96-wgc3
    update:
      packageTargets:
        '@types/node': minor
        typescript: minor

model:
  schema: jsonschema

  codeGenerators:
    - generator: typescriptModelClass
      globs: [./src/configurations/schemas/*.yaml]
      nestedSchemas: []
      output: src/configurations/generated.ts
    - generator: typescriptModelClass
      globs: [./src/scenarios/schemas/*.yaml]
      nestedSchemas: []
      output: src/scenarios/generated.ts
    - generator: typescriptModelClass
      globs: [./src/timeline/schemas/*.yaml]
      nestedSchemas: []
      output: src/timeline/generated.ts
