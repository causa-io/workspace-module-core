# yaml-language-server: $schema=https://json-schema.org/draft/2020-12/schema

title: GraphNode
type: object
description: |-
  A single node of the architecture graph.

  A node is anything that can be pointed at, navigated to, or measured: a
  project, a service, an event topic, an entity, a state of that entity, etc.

  A node carries neither its type nor its id: both are given by its position in
  `Nodes`. Its id is `<type>:<locator>`.
additionalProperties: false
required:
  - name
  - origin
properties:
  parent:
    type: string
    description: |-
      The id of the containing node. Absent on a root node.

      The parent of a node must be in the same layer.

  name:
    type: string
    description: The display name of the node.

  description:
    type: string
    description: |-
      A Markdown description, usually copied from the underlying declaration.

  origin:
    oneOf:
      - $ref: ./origin.yaml
    description: |-
      The workspace sources the node was extracted from, how it was extracted,
      and how much to trust it.

  tags:
    type: array
    description: |-
      Free-form labels for concerns that cut across node types. For example:
      - `pii`: the node holds or carries personal data.
      - `deprecated`: a `v1` topic superseded by a `v2`, so its remaining
        consumers stand out.
    items:
      type: string

  data:
    title: GraphNodeData
    type: object
    description: The type-specific payload of the node.
    additionalProperties: true
    properties:
      links:
        type: array
        description: |-
          Links to web pages about the node, e.g. its resource in the provider's
          console. Added when the graph is enriched with environment data.
        items:
          $ref: '#/$defs/GraphLink'

      alerts:
        type: array
        description: |-
          The alerts raised by the provider's monitoring for the node's
          resource, open at the end of the evaluation window. Added when the
          graph is enriched with environment data, and absent when no alert is
          open.
        items:
          $ref: ./alert.yaml

  metrics:
    type: object
    description: |-
      The point-in-time values of the node's metrics, keyed by metric name.
      Added when the graph is enriched with environment data.
    additionalProperties:
      $ref: ./metric-value.yaml

$defs:
  GraphLink:
    title: GraphLink
    type: object
    description: A link to a web page about a node.
    additionalProperties: false
    required:
      - label
      - url
    properties:
      label:
        type: string
        description: The text of the link.

      url:
        type: string
        description: The URL of the page.
